openapi: 3.1.0
info:
  title: Kanbien Platform API
  version: 0.1.0
  description: >
    OpenAPI specification for the platform API. This currently documents the
    platform health route and the rootUsers feature mounted at /v1/root-users.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Platform
  - name: Root Users

paths:
  /v1/health:
    get:
      tags:
        - Platform
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Platform is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/root-users:
    post:
      tags:
        - Root Users
      summary: Create a root user
      operationId: createRootUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootUserBody"
      responses:
        "201":
          description: Root user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags:
        - Root Users
      summary: List root users
      description: Lists root users with pagination, sorting, and filters.
      operationId: listRootUsers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RootUsersOrderBy"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/EmailPrefix"
        - $ref: "#/components/parameters/FirstNamePrefix"
        - $ref: "#/components/parameters/LastNamePrefix"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
        - $ref: "#/components/parameters/DeletedAtFrom"
        - $ref: "#/components/parameters/DeletedAtTo"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Paginated root users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRootUsersEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/by-email:
    get:
      tags:
        - Root Users
      summary: Get a visible root user by exact email
      operationId: getRootUserByEmail
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Matching root user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/active:
    get:
      tags:
        - Root Users
      summary: List active root users
      operationId: listActiveRootUsers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/ActiveRootUsersOrderBy"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/EmailPrefix"
        - $ref: "#/components/parameters/FirstNamePrefix"
        - $ref: "#/components/parameters/LastNamePrefix"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
      responses:
        "200":
          description: Paginated active root users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRootUsersEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/deleted:
    get:
      tags:
        - Root Users
      summary: List deleted root users
      operationId: listDeletedRootUsers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RootUsersOrderBy"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/EmailPrefix"
        - $ref: "#/components/parameters/FirstNamePrefix"
        - $ref: "#/components/parameters/LastNamePrefix"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
        - $ref: "#/components/parameters/DeletedAtFrom"
        - $ref: "#/components/parameters/DeletedAtTo"
        - name: excludeAnonymized
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paginated deleted root users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRootUsersEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/{rootUserId}:
    get:
      tags:
        - Root Users
      summary: Get a visible root user by ID
      operationId: getRootUserById
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags:
        - Root Users
      summary: Update a visible root user
      operationId: updateRootUser
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRootUserBody"
      responses:
        "200":
          description: Root user updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Root Users
      summary: Soft delete a root user
      operationId: deleteRootUser
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/{rootUserId}/remove:
    post:
      tags:
        - Root Users
      summary: Anonymize and remove a root user
      operationId: removeRootUser
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user anonymized and removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/{rootUserId}/reactivate:
    post:
      tags:
        - Root Users
      summary: Reactivate a soft-deleted root user
      operationId: reactivateRootUser
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    RootUserId:
      name: rootUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    OrderDirection:
      name: orderDirection
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    RootUsersOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [email, firstName, lastName, status, createdAt, updatedAt, deletedAt]
        default: updatedAt

    ActiveRootUsersOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [email, firstName, lastName, createdAt, updatedAt]
        default: updatedAt

    EmailPrefix:
      name: emailPrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    FirstNamePrefix:
      name: firstNamePrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    LastNamePrefix:
      name: lastNamePrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    CreatedAtFrom:
      name: createdAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    CreatedAtTo:
      name: createdAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    UpdatedAtFrom:
      name: updatedAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    UpdatedAtTo:
      name: updatedAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    DeletedAtFrom:
      name: deletedAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    DeletedAtTo:
      name: deletedAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RootUserStatus"

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflict with existing or current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]

    RootUserStatus:
      type: string
      enum: [active, inactive]

    RootUser:
      type: object
      additionalProperties: false
      properties:
        rootUserId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        anonymized:
          type: boolean
        status:
          $ref: "#/components/schemas/RootUserStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
      required:
        - rootUserId
        - email
        - firstName
        - lastName
        - anonymized
        - status
        - createdAt
        - updatedAt
        - deletedAt

    RootUserEnvelope:
      type: object
      additionalProperties: false
      properties:
        body:
          $ref: "#/components/schemas/RootUser"
      required: [body]

    PaginatedRootUsers:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RootUser"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
      required: [items, page, pageSize, totalItems, totalPages]

    PaginatedRootUsersEnvelope:
      type: object
      additionalProperties: false
      properties:
        body:
          $ref: "#/components/schemas/PaginatedRootUsers"
      required: [body]

    CreateRootUserBody:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        firstName:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
        lastName:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
        status:
          $ref: "#/components/schemas/RootUserStatus"
      required: [email]

    UpdateRootUserBody:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          type: string
          format: email
        firstName:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
        lastName:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
        status:
          $ref: "#/components/schemas/RootUserStatus"

    ErrorIssue:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reason:
          type: string
      required: [field, reason]

    ErrorDetails:
      oneOf:
        - type: object
          additionalProperties: true
        - type: object
          additionalProperties: false
          properties:
            issues:
              type: array
              items:
                $ref: "#/components/schemas/ErrorIssue"
          required: [issues]

    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          $ref: "#/components/schemas/ErrorDetails"
      required: [code, message]
