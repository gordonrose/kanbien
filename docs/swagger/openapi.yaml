      summary: Soft-delete a tenant-admin profile
      operationId: deleteTenantAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TenantAdminId"
