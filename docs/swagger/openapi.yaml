openapi: 3.1.0
info:
  title: Kanbien Platform API
  version: 0.2.0
  description: >
    OpenAPI specification for the platform API. This documents the platform
    health route, root-user authentication, and the protected rootUsers feature.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Platform
  - name: Root Auth
  - name: Root Users

paths:
  /v1/health:
    get:
      tags:
        - Platform
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Platform is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/root-auth/login/password:
    post:
      tags:
        - Root Auth
      summary: Start root-user login with email and password
      operationId: loginRootUserWithPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootAuthPasswordLoginBody"
      responses:
        "200":
          description: Password accepted and SSH challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/login/ssh:
    post:
      tags:
        - Root Auth
      summary: Complete root-user login with SSH proof
      operationId: completeRootUserSshChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootAuthSshLoginBody"
      responses:
        "200":
          description: Root user authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSessionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/browser/login/ssh:
    post:
      tags:
        - Root Auth
      summary: Complete browser root-user login with SSH proof and set a session cookie
      operationId: completeRootUserBrowserSshChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootAuthSshLoginBody"
      responses:
        "200":
          description: Root user authenticated for the browser shell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAdminBrowserSessionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/browser/session:
    get:
      tags:
        - Root Auth
      summary: Get the current browser root-admin session summary
      operationId: getRootAdminBrowserSession
      responses:
        "200":
          description: Current browser session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAdminBrowserSessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/browser/logout:
    post:
      tags:
        - Root Auth
      summary: Log the browser root-admin session out and clear its cookie
      operationId: logoutRootAdminBrowserSession
      responses:
        "200":
          description: Browser session logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/principals:
    post:
      tags:
        - Root Auth
      summary: Create an auth principal for an existing root user
      operationId: createRootUserAuthPrincipal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootAuthPrincipalBody"
      responses:
        "201":
          description: Auth principal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRootAuthPrincipalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/password/change:
    post:
      tags:
        - Root Auth
      summary: Change the authenticated root user's password
      operationId: changeRootUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRootAuthPasswordBody"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/ssh-keys:
    post:
      tags:
        - Root Auth
      summary: Register an SSH public key
      operationId: addRootUserSshPublicKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRootAuthSshKeyBody"
      responses:
        "201":
          description: SSH key stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSshKeySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags:
        - Root Auth
      summary: List SSH public keys for the authenticated root user
      operationId: listRootUserSshPublicKeys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSH public keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSshKeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/ssh-keys/{keyId}:
    delete:
      tags:
        - Root Auth
      summary: Revoke an SSH public key
      operationId: revokeRootUserSshPublicKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthSshKeyId"
      responses:
        "200":
          description: SSH key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/sessions:
    get:
      tags:
        - Root Auth
      summary: List sessions for the authenticated root user
      operationId: listRootUserSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/sessions/{sessionId}/revoke:
    post:
      tags:
        - Root Auth
      summary: Revoke one of the authenticated root user's sessions
      operationId: revokeRootUserSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthSessionId"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/logout:
    post:
      tags:
        - Root Auth
      summary: Log out the current root-user session
      operationId: logoutRootUserSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users:
    post:
      tags:
        - Root Users
      summary: Create a root user
      operationId: createRootUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootUserBody"
      responses:
        "201":
          description: Root user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags:
        - Root Users
      summary: List root users or look up by exact email
      operationId: queryRootUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RootUsersOrderBy"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/EmailPrefix"
        - $ref: "#/components/parameters/FirstNamePrefix"
        - $ref: "#/components/parameters/LastNamePrefix"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
        - $ref: "#/components/parameters/DeletedAtFrom"
        - $ref: "#/components/parameters/DeletedAtTo"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Exact-match root user or paginated list result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RootUser"
                  - $ref: "#/components/schemas/PaginatedRootUsers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/active:
    get:
      tags:
        - Root Users
      summary: List active root users
      operationId: listActiveRootUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/ActiveRootUsersOrderBy"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/EmailPrefix"
        - $ref: "#/components/parameters/FirstNamePrefix"
        - $ref: "#/components/parameters/LastNamePrefix"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
      responses:
        "200":
          description: Paginated active root users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRootUsers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/deleted:
    get:
      tags:
        - Root Users
      summary: List deleted root users
      operationId: listDeletedRootUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RootUsersOrderBy"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/EmailPrefix"
        - $ref: "#/components/parameters/FirstNamePrefix"
        - $ref: "#/components/parameters/LastNamePrefix"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
        - $ref: "#/components/parameters/DeletedAtFrom"
        - $ref: "#/components/parameters/DeletedAtTo"
        - $ref: "#/components/parameters/ExcludeAnonymized"
      responses:
        "200":
          description: Paginated deleted root users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRootUsers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/{rootUserId}:
    get:
      tags:
        - Root Users
      summary: Get a visible root user by ID
      operationId: getRootUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags:
        - Root Users
      summary: Update a visible root user
      operationId: updateRootUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRootUserBody"
      responses:
        "200":
          description: Root user updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Root Users
      summary: Soft delete a root user
      operationId: deleteRootUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/{rootUserId}/remove:
    post:
      tags:
        - Root Users
      summary: Anonymize and remove a root user
      operationId: removeRootUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user anonymized and removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/{rootUserId}/reactivate:
    post:
      tags:
        - Root Users
      summary: Reactivate a soft-deleted root user
      operationId: reactivateRootUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token

  parameters:
    RootUserId:
      name: rootUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AuthSshKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string

    AuthSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    OrderDirection:
      name: orderDirection
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    RootUsersOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [email, firstName, lastName, status, createdAt, updatedAt, deletedAt]
        default: updatedAt

    ActiveRootUsersOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [email, firstName, lastName, createdAt, updatedAt]
        default: updatedAt

    Email:
      name: email
      in: query
      required: false
      schema:
        type: string
        format: email

    EmailPrefix:
      name: emailPrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    FirstNamePrefix:
      name: firstNamePrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    LastNamePrefix:
      name: lastNamePrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    CreatedAtFrom:
      name: createdAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    CreatedAtTo:
      name: createdAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    UpdatedAtFrom:
      name: updatedAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    UpdatedAtTo:
      name: updatedAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    DeletedAtFrom:
      name: deletedAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    DeletedAtTo:
      name: deletedAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RootUserStatus"

    ExcludeAnonymized:
      name: excludeAnonymized
      in: query
      required: false
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication failed or was not supplied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Authenticated caller is not allowed to complete the action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflict with existing or current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: Request was throttled or temporarily locked due to too many attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]

    RootUserStatus:
      type: string
      enum: [active, inactive]

    CountValue:
      oneOf:
        - type: integer
        - type: string
          enum: ["10000+"]

    RootUser:
      type: object
      properties:
        rootUserId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        anonymized:
          type: boolean
        status:
          $ref: "#/components/schemas/RootUserStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
      required:
        - rootUserId
        - email
        - anonymized
        - status
        - createdAt
        - updatedAt
        - deletedAt

    PaginatedRootUsers:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RootUser"
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        totalSearchableRecords:
          $ref: "#/components/schemas/CountValue"
        totalMatchingRecords:
          $ref: "#/components/schemas/CountValue"
      required:
        - items
        - page
        - pageSize
        - totalPages
        - totalSearchableRecords
        - totalMatchingRecords

    RootAuthPasswordLoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    RootAuthChallengeResponse:
      type: object
      properties:
        status:
          type: string
          enum: [SSH_CHALLENGE_REQUIRED]
        challengeId:
          type: string
        challengeText:
          type: string
        availableSshKeys:
          type: array
          items:
            $ref: "#/components/schemas/RootAuthLoginSshKeyOption"
      required: [status, challengeId, challengeText, availableSshKeys]

    RootAuthSshLoginBody:
      type: object
      properties:
        challengeId:
          type: string
        signature:
          type: string
        publicKeyFingerprint:
          type: string
      required: [challengeId, signature, publicKeyFingerprint]

    RootAuthSessionSummary:
      type: object
      properties:
        status:
          type: string
          enum: [AUTHENTICATED]
        sessionId:
          type: string
        authPrincipalId:
          type: string
        rootUserId:
          type: string
          format: uuid
        authenticatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [sessionId, rootUserId, authenticatedAt, expiresAt]

    RootAuthLoginSshKeyOption:
      type: object
      properties:
        keyId:
          type: string
        label:
          type: string
        fingerprint:
          type: string
      required: [keyId, label, fingerprint]

    RootAdminBrowserSessionSummary:
      type: object
      properties:
        rootUserId:
          type: string
          format: uuid
        authPrincipalId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        expiresAt:
          type: string
          format: date-time
      required: [rootUserId, authPrincipalId, displayName, email, expiresAt]

    RootAuthSessionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RootAuthSessionSummary"
      required: [items]

    CreateRootAuthPrincipalBody:
      type: object
      properties:
        rootUserId:
          type: string
          format: uuid
        loginEmail:
          type: string
          format: email
        password:
          type: string
      required: [rootUserId, loginEmail, password]

    CreateRootAuthPrincipalResponse:
      type: object
      properties:
        authPrincipalId:
          type: string
        rootUserId:
          type: string
          format: uuid
        loginEmail:
          type: string
          format: email
      required: [authPrincipalId, rootUserId, loginEmail]

    ChangeRootAuthPasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required: [currentPassword, newPassword]

    AddRootAuthSshKeyBody:
      type: object
      properties:
        label:
          type: string
        publicKey:
          type: string
      required: [label, publicKey]

    RootAuthSshKeySummary:
      type: object
      properties:
        keyId:
          type: string
        label:
          type: string
        algorithm:
          type: string
        fingerprint:
          type: string
        status:
          type: string
          enum: [active, revoked]
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
      required:
        - keyId
        - label
        - algorithm
        - fingerprint
        - status
        - createdAt
        - revokedAt

    RootAuthSshKeyListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RootAuthSshKeySummary"
      required: [items]

    CreateRootUserBody:
      type: object
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
      required: [email]

    UpdateRootUserBody:
      type: object
      minProperties: 1
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/RootUserStatus"

    StatusResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorDetails:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          $ref: "#/components/schemas/ErrorDetails"
      required: [code, message]
