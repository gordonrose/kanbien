        type: string
        minLength: 1

    CanonicalReferenceKey:
      name: referenceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1

    WebAppDiscoveryRunId:
      name: webAppDiscoveryRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DiscoveredWebAppSurfaceId:
      name: discoveredWebAppSurfaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DiscoveredWebAppStructureNodeId:
      name: discoveredWebAppStructureNodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AuthSshKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string

    AuthSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string

