    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    CreateAssetUploadIntentBody:
      type: object
      additionalProperties: false
      properties:
        scopeType:
          type: string
          enum: [root, tenant]
        tenantId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [image, video, audio, document, other]
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/svg+xml]
        byteSize:
          type: integer
          minimum: 1
          maximum: 5242880
        visibility:
          type: string
          enum: [private, public]
          default: private
        originalFilename:
          type: string
          minLength: 1
          maxLength: 255
        expectedChecksumSha256:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        piiPosture:
          type: string
          enum: [unknown, none, possible, contains]
      required: [scopeType, kind, contentType, byteSize, visibility]

    CompleteAssetUploadBody:
      type: object
      additionalProperties: false
      properties:
        uploadIntentId:
          type: string
          format: uuid
        checksumSha256:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
      required: [uploadIntentId]

    CleanupExpiredAssetUploadsBody:
      type: object
      additionalProperties: false
      properties:
        batchSize:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        retryFailedOnly:
          type: boolean
          default: false
        dryRun:
          type: boolean
          default: false

    CleanupExpiredAssetUploadsResponse:
      type: object
      properties:
        expiredIntents:
          type: integer
        rejectedAssets:
          type: integer
        deletedObjects:
          type: integer
        missingObjects:
          type: integer
        failedDeletes:
          type: integer
      required: [expiredIntents, rejectedAssets, deletedObjects, missingObjects, failedDeletes]

    AssetUploadTarget:
      type: object
      properties:
        mode:
          type: string
          enum: [local-filesystem]
        storageKey:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [mode, storageKey, expiresAt]

    AssetUploadIntent:
      type: object
      properties:
        uploadIntentId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, completed, expired, rejected]
        actorType:
          type: string
        actorId:
          type: string
        scopeType:
          type: string
          enum: [root, tenant]
        tenantId:
          type: [string, "null"]
          format: uuid
        storageKey:
          type: string
        expectedContentType:
          type: string
        maxByteSize:
          type: integer
        expectedChecksumSha256:
          type: [string, "null"]
        expiresAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
      required: [uploadIntentId, assetId, status, actorType, actorId, scopeType, tenantId, storageKey, expectedContentType, maxByteSize, expectedChecksumSha256, expiresAt, completedAt]

    Asset:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        scopeType:
          type: string
          enum: [root, tenant]
        tenantId:
          type: [string, "null"]
          format: uuid
        kind:
          type: string
          enum: [image, video, audio, document, other]
        visibility:
          type: string
          enum: [private, public]
        originalFilename:
          type: [string, "null"]
        storageProvider:
          type: string
        storageKey:
          type: string
        claimedContentType:
          type: string
        verifiedContentType:
          type: [string, "null"]
        byteSize:
          type: integer
        expectedChecksumSha256:
          type: [string, "null"]
        observedChecksumSha256:
          type: [string, "null"]
        checksumVerificationStatus:
          type: string
          enum: [not_provided, provider_verified, backend_verified, unavailable, mismatched]
        contentVerificationStatus:
          type: string
          enum: [claimed_only, metadata_verified, svg_sanitized, failed]
        lifecycleStatus:
          type: string
          enum: [pending_upload, uploaded, ready, rejected, deleted]
        processingStatus:
          type: string
          enum: [not_required, pending, processing, ready, failed, rejected]
        piiPosture:
          type: string
          enum: [unknown, none, possible, contains]
        cleanupStatus:
          type: string
          enum: [not_required, pending, deleted, object_missing, failed_retryable]
        cleanupFailureReason:
          type: [string, "null"]
        rejectionReason:
          type: [string, "null"]
        createdByActorType:
          type: string
        createdByActorId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
      required: [assetId, scopeType, tenantId, kind, visibility, storageProvider, storageKey, claimedContentType, byteSize, checksumVerificationStatus, contentVerificationStatus, lifecycleStatus, processingStatus, piiPosture, cleanupStatus, createdByActorType, createdByActorId, createdAt, updatedAt, deletedAt]

    CreateAssetUploadIntentResponse:
      type: object
      properties:
        asset:
          $ref: "#/components/schemas/Asset"
        uploadIntent:
          $ref: "#/components/schemas/AssetUploadIntent"
        uploadTarget:
          $ref: "#/components/schemas/AssetUploadTarget"
      required: [asset, uploadIntent, uploadTarget]

