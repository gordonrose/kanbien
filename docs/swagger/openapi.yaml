openapi: 3.1.0
info:
  title: Kanbien Platform API
  version: 0.2.0
  description: >
    OpenAPI specification for the platform API. This documents the platform
    health route, root-user authentication, root-role authorization
    administration, the protected rootUsers feature, the protected tenants
    feature, the protected tenantAdmins feature, the protected
    notificationDelivery feature, the protected capability-contract-catalog
    feature, the protected assets feature, the design-system-canonicals feature, the protected web-app-hierarchy feature, the protected
    web-app-page-settings feature, the protected web-app-surface-discovery
    feature, and the shared tenant-auth foundation.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Platform
  - name: Root Auth
  - name: Root Roles
  - name: Root Users
  - name: Tenants
  - name: Tenant Admins
  - name: Notification Delivery
  - name: Capability Contract Catalog
  - name: Assets
  - name: Design System Canonicals
  - name: Web App Hierarchy
  - name: Web App Page Settings
  - name: Web App Surface Discovery
  - name: Tenant Auth

paths:
  /v1/health:
    get:
      tags:
        - Platform
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Platform is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/assets/upload-intents:
    post:
      tags:
        - Assets
      summary: Create an asset upload intent
      operationId: createAssetUploadIntent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetUploadIntentBody"
      responses:
        "201":
          description: Upload intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAssetUploadIntentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/assets/{assetId}/complete:
    post:
      tags:
        - Assets
      summary: Complete an asset upload after storage verification
      operationId: completeAssetUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAssetUploadBody"
      responses:
        "200":
          description: Asset upload completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/assets/{assetId}/upload-bytes:
    post:
      tags:
        - Assets
      summary: Upload browser-provided bytes for a pending asset intent
      operationId: uploadAssetBytes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetIdPath"
        - name: uploadIntentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/svg+xml:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Asset bytes accepted for pending upload verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/assets/{assetId}:
    get:
      tags:
        - Assets
      summary: Read ready asset metadata
      operationId: readAssetMetadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetIdPath"
      responses:
        "200":
          description: Asset metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/assets/{assetId}/content:
    get:
      tags:
        - Assets
      summary: Stream ready private asset content same-origin
      operationId: readAssetContent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetIdPath"
      responses:
        "200":
          description: Asset content stream
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/assets/{assetId}/delete:
    post:
      tags:
        - Assets
      summary: Soft-delete an asset
      operationId: deleteAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetIdPath"
      responses:
        "200":
          description: Asset soft-deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/assets/internal/cleanup-expired-uploads:
    post:
      tags:
        - Assets
      summary: Clean up expired asset upload intents
      operationId: cleanupExpiredAssetUploads
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupExpiredAssetUploadsBody"
      responses:
        "200":
          description: Cleanup run summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupExpiredAssetUploadsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/design-system-canonicals/families:
    post:
      tags:
        - Design System Canonicals
      summary: Create a design-system canonical family
      operationId: createDesignSystemCanonicalFamily
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDesignSystemCanonicalFamilyBody"
      responses:
        "201":
          description: Canonical family created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSystemCanonicalFamily"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/design-system-canonicals/families/{canonicalFamilyId}:
    get:
      tags:
        - Design System Canonicals
      summary: Read a design-system canonical family by id
      operationId: getDesignSystemCanonicalFamily
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalFamilyId"
      responses:
        "200":
          description: Canonical family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSystemCanonicalFamily"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Design System Canonicals
      summary: Update a design-system canonical family
      operationId: updateDesignSystemCanonicalFamily
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalFamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDesignSystemCanonicalFamilyBody"
      responses:
        "200":
          description: Canonical family updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSystemCanonicalFamily"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/design-system-canonicals/families/{canonicalFamilyId}/references:
    post:
      tags:
        - Design System Canonicals
      summary: Create a design-system canonical reference
      operationId: createDesignSystemCanonicalReference
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalFamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDesignSystemCanonicalReferenceBody"
      responses:
        "201":
          description: Canonical reference created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSystemCanonicalReference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/design-system-canonicals/references/{canonicalReferenceId}:
    get:
      tags:
        - Design System Canonicals
      summary: Read a design-system canonical reference by id
      operationId: getDesignSystemCanonicalReference
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalReferenceId"
      responses:
        "200":
          description: Canonical reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSystemCanonicalReference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Design System Canonicals
      summary: Update a design-system canonical reference
      operationId: updateDesignSystemCanonicalReference
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalReferenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDesignSystemCanonicalReferenceBody"
      responses:
        "200":
          description: Canonical reference updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSystemCanonicalReference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/design-system-canonicals/public/families:
    get:
      tags:
        - Design System Canonicals
      summary: List live public design-system canonical families
      operationId: listPublicDesignSystemCanonicalFamilies
      responses:
        "200":
          description: Live canonical families
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCanonicalFamilyListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/design-system-canonicals/public/families/{familyKey}/launcher:
    get:
      tags:
        - Design System Canonicals
      summary: Read a public generated canonical launcher projection
      operationId: getPublicDesignSystemCanonicalLauncher
      parameters:
        - $ref: "#/components/parameters/CanonicalFamilyKey"
      responses:
        "200":
          description: Public canonical launcher projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCanonicalLauncherResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/design-system-canonicals/public/families/{familyKey}/references/{referenceId}:
    get:
      tags:
        - Design System Canonicals
      summary: Read a public generated canonical rendering projection
      operationId: getPublicDesignSystemCanonicalRendering
      parameters:
        - $ref: "#/components/parameters/CanonicalFamilyKey"
        - $ref: "#/components/parameters/CanonicalReferenceKey"
      responses:
        "200":
          description: Public canonical rendering projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCanonicalRenderingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/login/password:
    post:
      tags:
        - Root Auth
      summary: Start root-user login with email and password
      operationId: loginRootUserWithPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootAuthPasswordLoginBody"
      responses:
        "200":
          description: Password accepted and SSH challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/login/ssh:
    post:
      tags:
        - Root Auth
      summary: Complete root-user login with SSH proof
      operationId: completeRootUserSshChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootAuthSshLoginBody"
      responses:
        "200":
          description: Root user authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSessionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/browser/login/ssh:
    post:
      tags:
        - Root Auth
      summary: Complete browser root-user login with SSH proof and set a session cookie
      operationId: completeRootUserBrowserSshChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootAuthSshLoginBody"
      responses:
        "200":
          description: Root user authenticated for the browser shell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAdminBrowserSessionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/browser/session:
    get:
      tags:
        - Root Auth
      summary: Get the current browser root-admin session summary
      operationId: getRootAdminBrowserSession
      responses:
        "200":
          description: Current browser session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAdminBrowserSessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/browser/logout:
    post:
      tags:
        - Root Auth
      summary: Log the browser root-admin session out and clear its cookie
      operationId: logoutRootAdminBrowserSession
      responses:
        "200":
          description: Browser session logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/principals:
    post:
      tags:
        - Root Auth
      summary: Create an auth principal for an existing root user
      operationId: createRootUserAuthPrincipal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootAuthPrincipalBody"
      responses:
        "201":
          description: Auth principal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRootAuthPrincipalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/password/change:
    post:
      tags:
        - Root Auth
      summary: Change the authenticated root user's password
      operationId: changeRootUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRootAuthPasswordBody"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/ssh-keys:
    post:
      tags:
        - Root Auth
      summary: Register an SSH public key
      operationId: addRootUserSshPublicKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRootAuthSshKeyBody"
      responses:
        "201":
          description: SSH key stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSshKeySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags:
        - Root Auth
      summary: List SSH public keys for the authenticated root user
      operationId: listRootUserSshPublicKeys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSH public keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSshKeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/ssh-keys/{keyId}:
    delete:
      tags:
        - Root Auth
      summary: Revoke an SSH public key
      operationId: revokeRootUserSshPublicKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthSshKeyId"
      responses:
        "200":
          description: SSH key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/sessions:
    get:
      tags:
        - Root Auth
      summary: List sessions for the authenticated root user
      operationId: listRootUserSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/sessions/{sessionId}/revoke:
    post:
      tags:
        - Root Auth
      summary: Revoke one of the authenticated root user's sessions
      operationId: revokeRootUserSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthSessionId"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/logout:
    post:
      tags:
        - Root Auth
      summary: Log out the current root-user session
