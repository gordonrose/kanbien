openapi: 3.1.0
info:
  title: Kanbien Platform API
  version: 0.2.0
  description: >
    OpenAPI specification for the platform API. This documents the platform
    health route, root-user authentication, root-role authorization
    administration, the protected rootUsers feature, the protected tenants
    feature, the protected tenantAdmins feature, the protected
    notificationDelivery feature, and the shared tenant-auth foundation.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Platform
  - name: Root Auth
  - name: Root Roles
  - name: Root Users
  - name: Tenants
  - name: Tenant Admins
  - name: Notification Delivery
  - name: Tenant Auth

paths:
  /v1/health:
    get:
      tags:
        - Platform
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Platform is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/root-auth/login/password:
    post:
      tags:
        - Root Auth
      summary: Start root-user login with email and password
      operationId: loginRootUserWithPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootAuthPasswordLoginBody"
      responses:
        "200":
          description: Password accepted and SSH challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/login/ssh:
    post:
      tags:
        - Root Auth
      summary: Complete root-user login with SSH proof
      operationId: completeRootUserSshChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootAuthSshLoginBody"
      responses:
        "200":
          description: Root user authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSessionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/browser/login/ssh:
    post:
      tags:
        - Root Auth
      summary: Complete browser root-user login with SSH proof and set a session cookie
      operationId: completeRootUserBrowserSshChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootAuthSshLoginBody"
      responses:
        "200":
          description: Root user authenticated for the browser shell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAdminBrowserSessionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/browser/session:
    get:
      tags:
        - Root Auth
      summary: Get the current browser root-admin session summary
      operationId: getRootAdminBrowserSession
      responses:
        "200":
          description: Current browser session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAdminBrowserSessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/browser/logout:
    post:
      tags:
        - Root Auth
      summary: Log the browser root-admin session out and clear its cookie
      operationId: logoutRootAdminBrowserSession
      responses:
        "200":
          description: Browser session logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/principals:
    post:
      tags:
        - Root Auth
      summary: Create an auth principal for an existing root user
      operationId: createRootUserAuthPrincipal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootAuthPrincipalBody"
      responses:
        "201":
          description: Auth principal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRootAuthPrincipalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/password/change:
    post:
      tags:
        - Root Auth
      summary: Change the authenticated root user's password
      operationId: changeRootUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRootAuthPasswordBody"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/ssh-keys:
    post:
      tags:
        - Root Auth
      summary: Register an SSH public key
      operationId: addRootUserSshPublicKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRootAuthSshKeyBody"
      responses:
        "201":
          description: SSH key stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSshKeySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags:
        - Root Auth
      summary: List SSH public keys for the authenticated root user
      operationId: listRootUserSshPublicKeys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSH public keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSshKeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/ssh-keys/{keyId}:
    delete:
      tags:
        - Root Auth
      summary: Revoke an SSH public key
      operationId: revokeRootUserSshPublicKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthSshKeyId"
      responses:
        "200":
          description: SSH key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/sessions:
    get:
      tags:
        - Root Auth
      summary: List sessions for the authenticated root user
      operationId: listRootUserSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootAuthSessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/sessions/{sessionId}/revoke:
    post:
      tags:
        - Root Auth
      summary: Revoke one of the authenticated root user's sessions
      operationId: revokeRootUserSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthSessionId"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-auth/logout:
    post:
      tags:
        - Root Auth
      summary: Log out the current root-user session
      operationId: logoutRootUserSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users:
    post:
      tags:
        - Root Users
      summary: Create a root user
      operationId: createRootUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootUserBody"
      responses:
        "201":
          description: Root user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags:
        - Root Users
      summary: List root users or look up by exact email
      operationId: queryRootUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RootUsersOrderBy"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/EmailPrefix"
        - $ref: "#/components/parameters/FirstNamePrefix"
        - $ref: "#/components/parameters/LastNamePrefix"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
        - $ref: "#/components/parameters/DeletedAtFrom"
        - $ref: "#/components/parameters/DeletedAtTo"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Exact-match root user or paginated list result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RootUser"
                  - $ref: "#/components/schemas/PaginatedRootUsers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/active:
    get:
      tags:
        - Root Users
      summary: List active root users
      operationId: listActiveRootUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/ActiveRootUsersOrderBy"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/EmailPrefix"
        - $ref: "#/components/parameters/FirstNamePrefix"
        - $ref: "#/components/parameters/LastNamePrefix"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
      responses:
        "200":
          description: Paginated active root users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRootUsers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/deleted:
    get:
      tags:
        - Root Users
      summary: List deleted root users
      operationId: listDeletedRootUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RootUsersOrderBy"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/EmailPrefix"
        - $ref: "#/components/parameters/FirstNamePrefix"
        - $ref: "#/components/parameters/LastNamePrefix"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
        - $ref: "#/components/parameters/DeletedAtFrom"
        - $ref: "#/components/parameters/DeletedAtTo"
        - $ref: "#/components/parameters/ExcludeAnonymized"
      responses:
        "200":
          description: Paginated deleted root users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRootUsers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/{rootUserId}:
    get:
      tags:
        - Root Users
      summary: Get a visible root user by ID
      operationId: getRootUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags:
        - Root Users
      summary: Update a visible root user
      operationId: updateRootUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRootUserBody"
      responses:
        "200":
          description: Root user updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Root Users
      summary: Soft delete a root user
      operationId: deleteRootUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/{rootUserId}/remove:
    post:
      tags:
        - Root Users
      summary: Anonymize and remove a root user
      operationId: removeRootUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user anonymized and removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/root-users/{rootUserId}/reactivate:
    post:
      tags:
        - Root Users
      summary: Reactivate a soft-deleted root user
      operationId: reactivateRootUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RootUserId"
      responses:
        "200":
          description: Root user reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenants:
    post:
      tags:
        - Tenants
      summary: Create a tenant
      operationId: createTenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantBody"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags:
        - Tenants
      summary: List visible tenants
      operationId: listTenants
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/TenantsOrderBy"
        - $ref: "#/components/parameters/BizIdPrefix"
        - $ref: "#/components/parameters/NamePrefix"
        - $ref: "#/components/parameters/TenantCategory"
        - $ref: "#/components/parameters/TenantStatus"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
      responses:
        "200":
          description: Paginated visible tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTenants"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenants/deleted:
    get:
      tags:
        - Tenants
      summary: List deleted tenants
      operationId: listDeletedTenants
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/OrderDirection"
        - $ref: "#/components/parameters/DeletedTenantsOrderBy"
        - $ref: "#/components/parameters/BizIdPrefix"
        - $ref: "#/components/parameters/NamePrefix"
        - $ref: "#/components/parameters/TenantCategory"
        - $ref: "#/components/parameters/TenantStatus"
        - $ref: "#/components/parameters/CreatedAtFrom"
        - $ref: "#/components/parameters/CreatedAtTo"
        - $ref: "#/components/parameters/UpdatedAtFrom"
        - $ref: "#/components/parameters/UpdatedAtTo"
        - $ref: "#/components/parameters/DeletedAtFrom"
        - $ref: "#/components/parameters/DeletedAtTo"
      responses:
        "200":
          description: Paginated deleted tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTenants"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenants/{tenantId}:
    get:
      tags:
        - Tenants
      summary: Get a visible tenant by ID
      operationId: getTenantById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Tenants
      summary: Update a visible tenant
      operationId: updateTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantBody"
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
