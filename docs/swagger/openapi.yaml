components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token

  parameters:
    RootUserId:
      name: rootUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RootRoleId:
      name: rootRoleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RootRoleAssignmentId:
      name: rootRoleAssignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AuthSshKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string

    AuthSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    OrderDirection:
      name: orderDirection
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    RootUsersOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [email, firstName, lastName, status, createdAt, updatedAt, deletedAt]
        default: updatedAt

    ActiveRootUsersOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [email, firstName, lastName, createdAt, updatedAt]
        default: updatedAt

    TenantsOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [bizId, name, category, status, createdAt, updatedAt]
        default: updatedAt

    DeletedTenantsOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [bizId, name, category, status, createdAt, updatedAt, deletedAt]
        default: updatedAt

    Email:
      name: email
      in: query
      required: false
      schema:
        type: string
        format: email

    EmailPrefix:
      name: emailPrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    FirstNamePrefix:
      name: firstNamePrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    LastNamePrefix:
      name: lastNamePrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    BizIdPrefix:
      name: bizIdPrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 1

    NamePrefix:
      name: namePrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 1

    CreatedAtFrom:
      name: createdAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    CreatedAtTo:
      name: createdAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    UpdatedAtFrom:
      name: updatedAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    UpdatedAtTo:
      name: updatedAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    DeletedAtFrom:
      name: deletedAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    DeletedAtTo:
      name: deletedAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RootUserStatus"

    TenantCategory:
      name: category
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TenantCategory"

    TenantStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TenantStatus"

    ExcludeAnonymized:
      name: excludeAnonymized
      in: query
      required: false
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication failed or was not supplied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Authenticated caller is not allowed to complete the action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflict with existing or current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: Request was throttled or temporarily locked due to too many attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]

    RootUserStatus:
      type: string
      enum: [active, inactive]

    TenantCategory:
      type: string
      enum: [customer, demo, test]

    TenantStatus:
      type: string
      enum: [draft, live, disabled, inactive]

    RootRoleSummary:
      type: object
      properties:
        rootRoleId:
          type: string
          format: uuid
        roleKey:
          type: string
        displayName:
          type: string
        description:
          type: string
        protected:
          type: boolean
        assignable:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deactivatedAt:
          type: [string, "null"]
          format: date-time
        activeGrantCount:
          type: integer
      required:
        - rootRoleId
        - roleKey
        - displayName
        - description
        - protected
        - assignable
        - createdAt
        - updatedAt
        - deactivatedAt
        - activeGrantCount

    PaginatedRootRoles:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RootRoleSummary"
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        totalSearchableRecords:
          $ref: "#/components/schemas/CountValue"
        totalMatchingRecords:
          $ref: "#/components/schemas/CountValue"
      required:
        - items
        - page
        - pageSize
        - totalPages
        - totalSearchableRecords
        - totalMatchingRecords

    RootAuthzCapabilitySummary:
      type: object
      properties:
        capabilityKey:
          type: string
        description:
          type: string
        mandatory:
          type: boolean
        protected:
          type: boolean
      required: [capabilityKey, description, mandatory, protected]

