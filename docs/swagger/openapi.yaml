        format: uuid

    RootRoleId:
      name: rootRoleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RootRoleAssignmentId:
      name: rootRoleAssignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TenantAdminId:
      name: tenantAdminId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    NotificationEmailId:
      name: emailId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    WebAppModuleId:
      name: webAppModuleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    WebAppPageId:
      name: webAppPageId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CanonicalFamilyId:
      name: canonicalFamilyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

