        "200":
          description: Tenant admin deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAdminSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenants/{tenantId}/admins/{tenantAdminId}/reactivate:
    post:
      tags:
        - Tenant Admins
      summary: Reactivate a deleted tenant-admin profile
      operationId: reactivateTenantAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TenantAdminId"
      responses:
        "200":
          description: Tenant admin reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAdminSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant-admin-verification/redeem:
    post:
      tags:
        - Tenant Admins
      summary: Publicly redeem a tenant-admin verification token
      operationId: redeemTenantAdminVerificationToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemTenantAdminVerificationBody"
      responses:
        "200":
          description: Tenant admin verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAdminSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: Tenant-admin verification token expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant-auth/principals/bootstrap:
    post:
      tags:
        - Tenant Auth
      summary: Bootstrap a shared tenant principal from verified onboarding proof
      operationId: bootstrapTenantAuthPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantAuthBootstrapBody"
      responses:
        "200":
          description: Shared tenant principal bootstrapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAuthBootstrapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Bootstrap proof expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant-auth/password/setup:
    post:
      tags:
        - Tenant Auth
      summary: Set the initial password for a bootstrapped tenant principal
      operationId: setupTenantAuthPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantAuthPasswordSetupBody"
      responses:
        "200":
          description: Initial password set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAuthPasswordSetupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: Password-setup proof expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant-auth/login/password:
    post:
      tags:
        - Tenant Auth
      summary: Log in a tenant principal with email and password
      operationId: loginTenantAuthPrincipalWithPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantAuthPasswordLoginBody"
      responses:
        "200":
          description: Onboarding-required or authenticated tenant-auth state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TenantAuthOnboardingRequiredResponse"
                  - $ref: "#/components/schemas/TenantAuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant-auth/session:
    get:
      tags:
        - Tenant Auth
      summary: Read the current authenticated tenant session
      operationId: getTenantAuthSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current tenant-auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant-auth/tenant-contexts:
    get:
      tags:
        - Tenant Auth
      summary: List tenant contexts reachable by the current authenticated principal
      operationId: listTenantAuthContexts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant contexts available to the current tenant session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAuthContextListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant-auth/tenant-selection:
    post:
      tags:
        - Tenant Auth
      summary: Select the active tenant context for the current authenticated session
      operationId: selectTenantAuthContext
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantAuthTenantSelectionBody"
      responses:
        "200":
          description: Active tenant selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant-auth/logout:
    post:
      tags:
        - Tenant Auth
      summary: Log out the current tenant session
      operationId: logoutTenantAuthSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant session logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAuthLogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token

  parameters:
    RootUserId:
      name: rootUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RootRoleId:
      name: rootRoleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RootRoleAssignmentId:
      name: rootRoleAssignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TenantAdminId:
      name: tenantAdminId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    NotificationEmailId:
      name: emailId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AuthSshKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string

    AuthSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    OrderDirection:
      name: orderDirection
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    RootUsersOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [email, firstName, lastName, status, createdAt, updatedAt, deletedAt]
        default: updatedAt

    ActiveRootUsersOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [email, firstName, lastName, createdAt, updatedAt]
        default: updatedAt

    TenantsOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [bizId, name, category, status, createdAt, updatedAt]
        default: updatedAt

    DeletedTenantsOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [bizId, name, category, status, createdAt, updatedAt, deletedAt]
        default: updatedAt

    NotificationDeliveryOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [requestedAt, sentAt, subject, recipientEmail, status]
        default: requestedAt

    TenantAdminsOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [updatedAt, createdAt, email, firstName, lastName]
        default: updatedAt

    Email:
      name: email
      in: query
      required: false
      schema:
        type: string
        format: email

    EmailPrefix:
      name: emailPrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    FirstNamePrefix:
      name: firstNamePrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    LastNamePrefix:
      name: lastNamePrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 3

    BizIdPrefix:
      name: bizIdPrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 1

    NamePrefix:
      name: namePrefix
      in: query
      required: false
      schema:
        type: string
        minLength: 1

    CreatedAtFrom:
      name: createdAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    CreatedAtTo:
      name: createdAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    UpdatedAtFrom:
      name: updatedAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    UpdatedAtTo:
      name: updatedAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    DeletedAtFrom:
      name: deletedAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    DeletedAtTo:
      name: deletedAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RootUserStatus"

    TenantCategory:
      name: category
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TenantCategory"

    NotificationDeliveryTenantId:
      name: tenantId
      in: query
      required: false
      schema:
        type: string
        format: uuid

    NotificationType:
      name: notificationType
      in: query
      required: false
      schema:
        type: string

    RecipientEmail:
      name: recipientEmail
      in: query
      required: false
      schema:
        type: string
        format: email

    RelatedEntityType:
      name: relatedEntityType
      in: query
      required: false
      schema:
        type: string

    RelatedEntityId:
      name: relatedEntityId
      in: query
      required: false
      schema:
        type: string

    OutboundEmailSubject:
      name: subject
      in: query
      required: false
      schema:
        type: string

    OutboundEmailStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OutboundEmailStatus"

    TenantAdminEmailVerificationStatus:
      name: emailVerificationStatus
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TenantAdminEmailVerificationStatus"

    NotificationProvider:
      name: provider
      in: query
      required: false
      schema:
        type: string

    CreatedByActorType:
      name: createdByActorType
      in: query
      required: false
      schema:
        type: string

    CreatedByActorId:
      name: createdByActorId
      in: query
      required: false
      schema:
        type: string

    RequestedAtFrom:
      name: requestedAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    RequestedAtTo:
      name: requestedAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    SentAtFrom:
      name: sentAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time

    SentAtTo:
      name: sentAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time

    TenantStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TenantStatus"

    ExcludeAnonymized:
      name: excludeAnonymized
      in: query
      required: false
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication failed or was not supplied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Authenticated caller is not allowed to complete the action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflict with existing or current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: Request was throttled or temporarily locked due to too many attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]

    RootUserStatus:
      type: string
      enum: [active, inactive]

    TenantCategory:
      type: string
      enum: [customer, demo, test]

    TenantStatus:
      type: string
      enum: [draft, live, disabled, inactive]

    RootRoleSummary:
      type: object
      properties:
        rootRoleId:
          type: string
          format: uuid
        roleKey:
          type: string
        displayName:
          type: string
        description:
          type: string
        protected:
          type: boolean
        assignable:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deactivatedAt:
          type: [string, "null"]
          format: date-time
        activeGrantCount:
          type: integer
      required:
        - rootRoleId
        - roleKey
        - displayName
        - description
        - protected
        - assignable
        - createdAt
        - updatedAt
        - deactivatedAt
        - activeGrantCount

    PaginatedRootRoles:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RootRoleSummary"
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        totalSearchableRecords:
          $ref: "#/components/schemas/CountValue"
        totalMatchingRecords:
          $ref: "#/components/schemas/CountValue"
      required:
        - items
        - page
        - pageSize
        - totalPages
        - totalSearchableRecords
        - totalMatchingRecords

    RootAuthzCapabilitySummary:
      type: object
      properties:
        capabilityKey:
          type: string
        description:
          type: string
        mandatory:
          type: boolean
        protected:
          type: boolean
      required: [capabilityKey, description, mandatory, protected]

    PaginatedRootAuthzCapabilities:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RootAuthzCapabilitySummary"
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        totalSearchableRecords:
          $ref: "#/components/schemas/CountValue"
        totalMatchingRecords:
          $ref: "#/components/schemas/CountValue"
      required:
        - items
        - page
        - pageSize
        - totalPages
        - totalSearchableRecords
        - totalMatchingRecords

    RootUserRoleAssignmentSummary:
      type: object
      properties:
        rootRoleAssignmentId:
          type: string
          format: uuid
        rootUserId:
          type: string
          format: uuid
        rootRoleId:
          type: string
          format: uuid
        roleKey:
          type: string
        displayName:
          type: string
        protected:
          type: boolean
        assignedAt:
          type: string
          format: date-time
        unassignedAt:
          type: [string, "null"]
          format: date-time
      required:
        - rootRoleAssignmentId
        - rootUserId
        - rootRoleId
        - roleKey
        - displayName
        - protected
        - assignedAt
        - unassignedAt

    PaginatedRootUserRoleAssignments:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RootUserRoleAssignmentSummary"
        page:
