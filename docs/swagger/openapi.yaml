      summary: Read an exact tenant-admin profile
      operationId: getTenantAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TenantAdminId"
      responses:
        "200":
          description: Tenant admin found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAdminSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Tenant Admins
      summary: Update editable tenant-admin profile fields
      operationId: updateTenantAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TenantAdminId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantAdminBody"
      responses:
        "200":
          description: Tenant admin updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAdminSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenants/{tenantId}/admins/{tenantAdminId}/verification/send:
    post:
      tags:
        - Tenant Admins
      summary: Send a tenant-admin verification email
      operationId: sendTenantAdminVerificationEmail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TenantAdminId"
      responses:
        "200":
          description: Verification email requested
