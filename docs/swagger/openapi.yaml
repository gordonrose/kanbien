        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    OrderDirection:
      name: orderDirection
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    RootUsersOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [email, firstName, lastName, status, createdAt, updatedAt, deletedAt]
        default: updatedAt

    ActiveRootUsersOrderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [email, firstName, lastName, createdAt, updatedAt]
        default: updatedAt

